name: Build APK
on: [push, workflow_dispatch]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Cari folder proyek (yang berisi settings.gradle)
        id: p
        run: |
          D=$(dirname "$(find . -name settings.gradle -not -path './.git/*' | head -1)")
          echo "Proyek: $D"; echo "dir=$D" >> "$GITHUB_OUTPUT"
      - name: Build
        working-directory: ${{ steps.p.outputs.dir }}
        run: gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: onebliss-apk
          path: ${{ steps.p.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
