name: Build APK
on: [push, workflow_dispatch]
jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Buka onebliss_android.zip bila ada
        run: |
          if [ -f onebliss_android.zip ]; then unzip -q -o onebliss_android.zip -d proj; fi
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Cari folder proyek (yang berisi settings.gradle)
        id: p
        run: |
          F=$(find . -name settings.gradle -not -path './.git/*' | head -1)
          if [ -z "$F" ]; then echo "settings.gradle tidak ditemukan"; ls -R | head -50; exit 1; fi
          D=$(dirname "$F"); echo "Proyek: $D"; echo "dir=$D" >> "$GITHUB_OUTPUT"
      - name: Build
        working-directory: ${{ steps.p.outputs.dir }}
        run: gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: onebliss-apk
          path: ${{ steps.p.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
