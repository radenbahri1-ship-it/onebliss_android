name: Build APK from ZIP

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Unzip Source Files
      run: |
        unzip -q onebliss_android.zip
        # Jika file zip langsung berisi isi folder, pindahkan ke root jika diperlukan
        if [ -d "onebliss_android" ]; then
          mv onebliss_android/* .
          mv onebliss_android/.* . 2>/dev/null || true
          rm -rf onebliss_android
        fi

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      continue-on-error: true

    - name: Build with Gradle
      run: ./gradlew assembleDebug
      continue-on-error: true

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: onebliss-apk
        path: "**/build/outputs/apk/debug/*.apk"
