name: Build APK from ZIP (Fix)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Unzip and Fix Folder Structure
      run: |
        unzip -q onebliss_android.zip
        # Cek jika ekstraksi menghasilkan folder pembungkus, pindahkan isinya ke root
        if [ -d "onebliss_android" ]; then
          cp -r onebliss_android/* . 2>/dev/null || true
          cp -r onebliss_android/.* . 2>/dev/null || true
        fi
        # Pastikan file gradlew memiliki izin eksekusi penuh
        chmod +x gradlew || true
        chmod +x app/gradlew || true 2>/dev/null || true

    - name: Build Debug APK
      run: |
        if [ -f "./gradlew" ]; then
          ./gradlew assembleDebug
        elif [ -f "./app/gradlew" ]; then
          cd app && ./gradlew assembleDebug
        else
          echo "Mencari gradlew secara mendalam..."
          find . -name gradlew -exec chmod +x {} \;
          find . -name gradlew -exec {} assembleDebug \;
        fi

    - name: Upload APK Result
      uses: actions/upload-artifact@v4
      with:
        name: onebliss-apk
        path: "**/build/outputs/apk/debug/*.apk"
